[project]
name = "carbonne"
version = "0.1.0"
description = "Fysisch accurate render van een epoxy bijzettafeltje (Mitsuba 3, spectraal)"
requires-python = ">=3.12,<3.14"
dependencies = ["mitsuba>=3.6", "numpy", "pydantic>=2"]

[project.scripts]
carbonne-smoke = "carbonne.smoke:main"
carbonne-t02 = "carbonne.render_t02:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carbonne"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
